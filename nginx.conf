# ============================================================
# Configuration NGINX - équivalent du .htaccess Apache
# ============================================================
# À inclure dans votre bloc http{} de nginx.conf
# ou à placer dans /etc/nginx/sites-available/1-ted-backoffice
# puis activer avec un lien symbolique vers sites-enabled/
#
# Adapter les valeurs suivantes à votre environnement :
#   - server_name  : votre domaine ou IP
#   - root         : chemin absolu vers la racine du projet
#   - fastcgi_pass : socket ou adresse de PHP-FPM
# ============================================================

server {
    listen 80;
    server_name localhost;  # Remplacer par votre domaine (ex: 1-ted.local)

    # Chemin absolu vers la racine du projet
    root /var/www/html/1-ted-backoffice;  # Adapter selon votre serveur
    index index.php;

    charset utf-8;

    # ----------------------------------------------------------
    # Suppression des trailing slashes (hors dossiers réels)
    # Équivalent : RewriteCond %{REQUEST_FILENAME} !-d
    #              RewriteRule ^(.+)/$ /$1 [R=301,L]
    # ----------------------------------------------------------
    rewrite ^(.+[^/])/$ $1 permanent;

    # ----------------------------------------------------------
    # Redirection de la racine vers /fr
    # Équivalent : RewriteRule ^$ fr [R=301,L]
    # ----------------------------------------------------------
    location = / {
        return 301 /fr;
    }

    # ----------------------------------------------------------
    # Fichiers statiques (CSS, JS, images, fonts…)
    # Servis directement sans passer par PHP
    # ----------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|pdf|mp4|webm|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------
    # Bloc principal de réécriture des URLs
    # L'ordre est important : du plus spécifique au plus général
    # ----------------------------------------------------------
    location / {

        # Servir les fichiers et dossiers existants directement
        # Équivalent aux RewriteCond %{REQUEST_FILENAME} !-f / !-d
        try_files $uri $uri/ @php_rewrites;
    }

    # Réécriture vers PHP pour les URLs virtuelles
    location @php_rewrites {

        # ---- Routes /data ----------------------------------------

        # /data/candidates/add -> /data/candidates/id/index.php?id=add
        rewrite ^/data/candidates/add$ /data/candidates/id/index.php?id=add last;

        # /data/jobs/add -> /data/jobs/id/index.php?id=add
        rewrite ^/data/jobs/add$ /data/jobs/id/index.php?id=add last;

        # /data/candidates/{id} -> /data/candidates/id/index.php?id={id}
        rewrite ^/data/candidates/([0-9]+)$ /data/candidates/id/index.php?id=$1 last;

        # /data/jobs/{id} -> /data/jobs/id/index.php?id={id}
        rewrite ^/data/jobs/([0-9]+)$ /data/jobs/id/index.php?id=$1 last;

        # ---- Routes user-account (ordre : plus spécifique d'abord) ---

        # /fr/user-account/{code12}/new-password
        # -> /[lang]/user-account/new-password.php?lang=fr&code={code}
        rewrite ^/([a-z]{2})/user-account/([a-zA-Z0-9]{12})/new-password$ /[lang]/user-account/new-password.php?lang=$1&code=$2 last;

        # /fr/user-account/{role}/{page}  (role = administrator|candidate|recruiter|company)
        # -> /[lang]/user-account/[role]/[page]/index.php?lang=fr&role={role}&page={page}
        rewrite ^/([a-z]{2})/user-account/(administrator|candidate|recruiter|company)/([^/]+)$ /[lang]/user-account/[role]/[page]/index.php?lang=$1&role=$2&page=$3 last;

        # /fr/user-account/{page}
        # -> /[lang]/user-account/{page}.php?lang=fr
        rewrite ^/([a-z]{2})/user-account/([^/]+)$ /[lang]/user-account/$2.php?lang=$1 last;

        # ---- Routes multi-langues ------------------------------------

        # /fr/{page}  -> /[lang]/[page]/index.php?lang=fr&page={page}
        rewrite ^/([a-z]{2})/([^/]+)$ /[lang]/[page]/index.php?lang=$1&page=$2 last;

        # /fr          -> /[lang]/index.php?lang=fr
        rewrite ^/([a-z]{2})$ /[lang]/index.php?lang=$1 last;
    }

    # ----------------------------------------------------------
    # Traitement PHP via PHP-FPM
    # ----------------------------------------------------------
    location ~ \.php$ {
        # Sécurité : n'exécuter que les fichiers PHP existants
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;   # ou unix:/run/php/php8.x-fpm.sock
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Transmettre les paramètres GET existants + ceux ajoutés par les rewrites
        fastcgi_param QUERY_STRING $query_string;

        include fastcgi_params;

        # Timeout PHP (à ajuster si nécessaire)
        fastcgi_read_timeout 60;
    }

    # ----------------------------------------------------------
    # Sécurité : bloquer l'accès aux fichiers sensibles
    # ----------------------------------------------------------
    location ~ /\.(ht|env|git|gitignore) {
        deny all;
        return 404;
    }

    location ~ \.(sql|md|bat|ps1)$ {
        deny all;
        return 404;
    }

    # ----------------------------------------------------------
    # Pages d'erreur personnalisées (optionnel)
    # ----------------------------------------------------------
    # error_page 404 /fr/404;
    # error_page 500 502 503 504 /fr/error;
}
